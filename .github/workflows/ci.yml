name: CI

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke experiment (no walk-forward)
        run: python scripts/run_experiment.py --skip-walk-forward
      - name: Smoke advanced experiment
        run: python scripts/run_advanced.py
